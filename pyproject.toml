[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-impact-benchmark"
version = "1.0.0"
description = "Context-Aware Change Impact and Regression Intelligence for AUTOSAR Software Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "sentence-transformers>=2.2.0",
    "lxml>=4.9.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pytest>=7.3.0",
    "rich>=13.0.0",
    "streamlit>=1.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
